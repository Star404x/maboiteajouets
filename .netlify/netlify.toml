headersOrigin = "config"
redirectsOrigin = "config"
functionsDirectory = "/data/.openclaw/workspace/maboiteajouets-v2/.netlify/functions"
functionsDirectoryOrigin = "config-v1"

[env]
ADMIN_EMAIL = "info.maboiteajouets@gmail.com"
EMAIL_FROM = "noreply@maboiteajouets.fr"

[functions]

[functions."*"]

[[plugins]]
origin = "default"
package = "@netlify/plugin-nextjs"

[plugins.inputs]

[build]
publish = "/data/.openclaw/workspace/maboiteajouets-v2/.next"
publishOrigin = "ui"
commandOrigin = "config"
command = "npm run build"
functions = "/data/.openclaw/workspace/maboiteajouets-v2/.netlify/functions"

[build.environment]
NEXT_TELEMETRY_DISABLED = "1"
NODE_VERSION = "20"
npm_package_engines_node = "20"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]